on:
  push:
    branches:
      - v2
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Check Vendored Imports
permissions:
   contents: read
jobs:
  check-imports:
    # Verify that packages vendored into Go's standard library only use
    # allowed stdlib imports. New imports require a matching update to the
    # deps_test.go patch in microsoft-go.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Check vendored package imports
      run: |
        go run github.com/microsoft/go-infra/cmd/check-imports@v0.0.12 \
          -pkg ./internal/fakecgo \
          -allow '' \
          -pkg ./internal/ossl \
          -allow errors,unsafe \
          -pkg ./osslsetup \
          -allow errors,strconv,sync,syscall,unsafe \
          -pkg .
